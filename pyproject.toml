[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corak"
version = "0.1.0"
description = "Procedurally generated geometric wallpapers for Linux desktops"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Klass" }]
readme = "README.md"
keywords = ["wallpaper", "generative", "procedural", "linux", "kde", "qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Artistic Software",
    "Topic :: Desktop Environment",
]
dependencies = ["PySide6>=6.7"]

[project.urls]
Homepage = "https://github.com/ChristianKlass/corak"
Source = "https://github.com/ChristianKlass/corak"
Issues = "https://github.com/ChristianKlass/corak/issues"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
corak = "corak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corak = ["data/themes/*.json"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# PySide6 ships stubs but not for every module it imports.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes: undefined names, unused imports and variables
    "I",     # import order
    "UP",    # constructs superseded by the target Python
    "B",     # bugbear: likely mistakes rather than style
    "SIM",   # simplifications
    "RUF",
]
ignore = [
    "E501",  # line length is the formatter's business, not the linter's
]
# Typographic characters in text the user reads, deliberately not their ASCII
# lookalikes.
allowed-confusables = ["\u00d7", "\u2014", "\u00b7", "\u2026", "\u2191", "\u2193", "\u2190", "\u2192"]

[tool.ruff.lint.per-file-ignores]
# Qt needs an application object before any of this can be imported, so the
# imports genuinely cannot come first.
# Stacked mock.patch contexts read better one per line than combined.
"tests/*" = ["E402", "SIM117"]
