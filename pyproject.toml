[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corak"
version = "0.1.0"
description = "Procedurally generated geometric wallpapers for Linux desktops"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
corak = "corak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
