name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after a commit still surface.
    - cron: "17 4 * * 1"

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          # The default set plus the queries that look for tainted data
          # reaching a filesystem path, which is the shape of bug this
          # project has already had once.
          queries: security-extended
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
