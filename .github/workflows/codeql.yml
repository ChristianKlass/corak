name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so advisories published after a commit still surface.
    - cron: "17 4 * * 1"

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # The default set plus the queries that look for tainted data
          # reaching a filesystem path, which is the shape of bug this
          # project has already had once.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
